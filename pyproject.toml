[project]
name = "python-monograph"
version = "0.3.0"
description = "A learned treatise on Python."
authors = [{ name = "JerodG", email = "2856163+jerodg@users.noreply.github.com" }]
dependencies = [
    "numpy>=1.26.4",
    "pandas>=2.2.1",
    "more-itertools>=10.2.0",
    "toolz>=0.12.1",
    "cytoolz>=0.12.3",
    "matplotlib>=3.8.3",
    "scikit-learn>=1.4.2",
    "textblob>=0.18.0.post0",
    "nltk>=3.8.1",
    "torch>=2.2.2",
    "numba>=0.59.1",
    "cuda-python>=12.4.0",
    "torchtext>=0.17.2",
    "scipy>=1.13.0",
    "optuna>=3.6.1",
    "langchain>=0.1.16",
    "spacy[cuda11x,transformers,lookups]>=3.7.4",
    "cupy-cuda11x<=13.0.0",
]
readme = "README.md"
requires-python = ">= 3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "pytest>=8.0.2",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.1",
    "leaping>=0.1.13",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/python_monograph"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    ".idea",
]

line-length = 132
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F", "W", "C901"]
ignore = []
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-rA  --verbose --assert=rewrite --benchmark-compare --benchmark-autosave --benchmark-save-data"
testpaths = ["tests"]
markers = ["random: marks tests as random (deselect with '-m \"not random\"')"]
